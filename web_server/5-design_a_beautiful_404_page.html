<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>404 - Ceci n'est pas une page</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1b1b3a; color: #ffffff; font-family: Georgia, serif; text-align: center; }
  .num { font-size: 96px; font-weight: bold; letter-spacing: 8px; margin: 0; }
  .ghost { position: relative; width: 120px; height: 150px; background: #ffffff; border-radius: 60px 60px 0 0; margin: 30px auto 40px; animation: float 3s ease-in-out infinite; }
  .ghost:before, .ghost:after { content: ""; position: absolute; top: 45px; width: 18px; height: 24px; background: #1b1b3a; border-radius: 50%; }
  .ghost:before { left: 32px; }
  .ghost:after { right: 32px; }
  .hem { position: absolute; left: 0; bottom: -14px; width: 120px; height: 28px; background: radial-gradient(circle at 20px 14px, #ffffff 14px, transparent 15px); background-size: 40px 28px; background-repeat: repeat-x; }
  h1 { font-size: 30px; margin: 10px 20px; }
  p { margin: 6px 20px; color: #c9c9e8; }
  a { display: inline-block; margin-top: 20px; padding: 10px 24px; background: #ff7a59; color: #ffffff; text-decoration: none; border-radius: 24px; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
</style>
</head>
<body>
  <p class="num">404</p>
  <div class="ghost"><div class="hem"></div></div>
  <h1>Ceci n'est pas une page</h1>
  <p>This is not a page. The one you wanted has vanished into thin air.</p>
  <a href="/">Take me home</a>
</body>
</html>
